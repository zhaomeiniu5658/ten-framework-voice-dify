name: ten-voice-ai-interview
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/aiviewer/Dockerfile
    image: ten-voice-ai-interview:${IMAGE_TAG:-main}
    platform: linux/amd64
    container_name: ten-voice-ai-interview
    init: true
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-3001}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases: [aiviewer-interview]
networks:
  default:
    name: aiviewer-interview
