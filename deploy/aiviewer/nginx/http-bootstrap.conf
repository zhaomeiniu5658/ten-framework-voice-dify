# Use only while issuing the first certificate; replace with the HTTPS vhost afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name aiviewer.ai.maypharm.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
