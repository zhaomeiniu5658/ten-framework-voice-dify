# Install under the existing Nginx configuration directory.
# The app is intentionally reachable only through this reverse proxy.
upstream aiviewer_ten_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiviewer.ai.maypharm.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiviewer.ai.maypharm.cn;

    ssl_certificate /etc/letsencrypt/live/aiviewer.ai.maypharm.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiviewer.ai.maypharm.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AiviewerSSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://aiviewer_ten_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
